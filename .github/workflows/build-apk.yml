name: Build APK (arm64-v8a)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # app/ 只有 lib 和 assets，没有平台目录。
      # 在临时目录生成 android/ 脚手架再拷回来，避免覆盖我们的 lib/main.dart
      - name: Scaffold Android platform
        working-directory: app
        run: |
          flutter create --platforms=android \
            --project-name flashcard \
            --org com.jiangfeng \
            /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          cp /tmp/scaffold/.metadata ./.metadata || true

      # 依赖里 kotlin-stdlib 解析到 2.2.20，但脚手架 Kotlin 编译器只有 1.8.x，
      # 元数据不兼容导致 flutter_tts 编译失败。把编译器与 stdlib 一起顶到 2.0.21。
      - name: Fix Kotlin / kotlin-stdlib version conflict
        working-directory: app/android
        run: |
          python3 - <<'PY'
          import os, re
          KVER = "2.0.21"
          for f in ("settings.gradle", "settings.gradle.kts"):
              if os.path.exists(f):
                  s = open(f).read()
                  s = re.sub(
                      r'(org\.jetbrains\.kotlin\.android["\']?\s*\)?\s*version\s*["\'])([0-9.]+)(["\'])',
                      lambda m: m.group(1) + KVER + m.group(3), s)
                  open(f, "w").write(s)
                  print("== patched", f)
                  print(s)
          for f in ("build.gradle", "build.gradle.kts"):
              if os.path.exists(f):
                  s = open(f).read()
                  if "kotlin-stdlib" not in s:
                      if f.endswith(".kts"):
                          s += ('\nsubprojects {\n  configurations.all {\n'
                                '    resolutionStrategy {\n'
                                '      force("org.jetbrains.kotlin:kotlin-stdlib:' + KVER + '")\n'
                                '    }\n  }\n}\n')
                      else:
                          s += ("\nsubprojects {\n  configurations.all {\n"
                                "    resolutionStrategy {\n"
                                "      force 'org.jetbrains.kotlin:kotlin-stdlib:" + KVER + "'\n"
                                "    }\n  }\n}\n")
                      open(f, "w").write(s)
                      print("== patched", f)
          PY

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build release APK (arm64-v8a only)
        working-directory: app
        run: |
          flutter build apk --release \
            --target-platform=android-arm64 \
            --split-per-abi

      - name: Show APK
        working-directory: app
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flashcard-arm64-v8a
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
