name: Build APK (arm64-v8a)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # app/ 只有 lib 和 assets，没有平台目录。
      # 在临时目录生成 android/ 脚手架再拷回来，避免覆盖 lib/main.dart
      - name: Scaffold Android platform
        working-directory: app
        run: |
          flutter create --platforms=android \
            --project-name flashcard \
            --org com.jiangfeng \
            /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          cp /tmp/scaffold/.metadata ./.metadata || true

      # 一次性打补丁：
      #   1. Kotlin 插件 1.8 -> 2.0.21，kotlin-stdlib 对齐（否则 flutter_tts 编译失败）
      #   2. minSdk -> 24（flutter_tts 要求）
      #   3. AndroidManifest 加存储权限（MANAGE_EXTERNAL_STORAGE）
      - name: Patch Android (kotlin / minSdk / permissions)
        working-directory: app/android
        run: |
          python3 - <<'PY'
          import os, re
          KVER = "2.0.21"

          # 1) Kotlin 插件版本
          for f in ("settings.gradle", "settings.gradle.kts"):
              if os.path.exists(f):
                  s = open(f).read()
                  s = re.sub(
                      r'(org\.jetbrains\.kotlin\.android["\']?\s*\)?\s*version\s*["\'])([0-9.]+)(["\'])',
                      lambda m: m.group(1) + KVER + m.group(3), s)
                  open(f, "w").write(s)
                  print("patched kotlin plugin:", f)

          # 2) 强制 kotlin-stdlib 对齐
          for f in ("build.gradle", "build.gradle.kts"):
              if os.path.exists(f):
                  s = open(f).read()
                  if "kotlin-stdlib" not in s:
                      if f.endswith(".kts"):
                          s += ('\nsubprojects {\n  configurations.all {\n'
                                '    resolutionStrategy {\n'
                                '      force("org.jetbrains.kotlin:kotlin-stdlib:' + KVER + '")\n'
                                '    }\n  }\n}\n')
                      else:
                          s += ("\nsubprojects {\n  configurations.all {\n"
                                "    resolutionStrategy {\n"
                                "      force 'org.jetbrains.kotlin:kotlin-stdlib:" + KVER + "'\n"
                                "    }\n  }\n}\n")
                      open(f, "w").write(s)
                      print("patched stdlib force:", f)

          # 3) minSdk -> 24
          for f in ("app/build.gradle", "app/build.gradle.kts"):
              if os.path.exists(f):
                  s = open(f).read()
                  s = re.sub(r'minSdk\s*=\s*(flutter\.minSdkVersion|\d+)', 'minSdk = 24', s)
                  s = re.sub(r'minSdkVersion\s+(flutter\.minSdkVersion|\d+)', 'minSdkVersion 24', s)
                  open(f, "w").write(s)
                  print("patched minSdk:", f)

          # 4) AndroidManifest 存储权限
          mf = "app/src/main/AndroidManifest.xml"
          if os.path.exists(mf):
              s = open(mf).read()
              perms = (
                  '    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n'
                  '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n'
                  '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n'
              )
              if "MANAGE_EXTERNAL_STORAGE" not in s:
                  s = s.replace("<application", perms + "    <application", 1)
                  open(mf, "w").write(s)
                  print("manifest patched")
              else:
                  print("manifest already has perms")
          PY

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build release APK (arm64-v8a only)
        working-directory: app
        run: |
          flutter build apk --release \
            --target-platform=android-arm64 \
            --split-per-abi

      - name: Show APK
        working-directory: app
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flashcard-arm64-v8a
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
