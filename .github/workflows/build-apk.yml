name: Build APK (arm64-v8a)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 模板 / 卡组 / 说明文档的唯一真源都在仓库根目录：
      #   templates/  卡牌模板（HTML/CSS/JS）
      #   decks/      卡组数据
      #   text/readme/ 给 Agent 看的说明文档（如「如何管理单词.md」）
      # app/assets/ 下的只是打包副本。这里构建前强制同步，
      # 保证以后只改根目录就够了 —— 改文档不用动任何 Dart 代码。
      - name: Sync templates, decks & readme into app assets
        run: |
          set -e
          mkdir -p app/assets/templates app/assets/decks app/assets/readme
          [ -d templates ]   && cp -r templates/.   app/assets/templates/ || true
          [ -d decks ]       && cp -r decks/.       app/assets/decks/     || true
          [ -d text/readme ] && cp -r text/readme/. app/assets/readme/    || true
          echo "--- synced assets ---"
          find app/assets/templates app/assets/decks app/assets/readme -type f | sort

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # app/ 只有 lib 和 assets，没有平台目录。
      # 在临时目录生成 android/ 脚手架再拷回来，避免覆盖 lib/main.dart
      - name: Scaffold Android platform
        working-directory: app
        run: |
          flutter create --platforms=android \
            --project-name flashcard \
            --org com.jiangfeng \
            /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          cp /tmp/scaffold/.metadata ./.metadata || true

      # 一次性打补丁：
      #   1. Kotlin 插件 1.8 -> 2.0.21，kotlin-stdlib 对齐（否则 flutter_tts 编译失败）
      #   2. minSdk -> 24（flutter_tts 要求）
      #   3. AndroidManifest 加存储权限（MANAGE_EXTERNAL_STORAGE）
      - name: Patch Android (kotlin / minSdk / permissions)
        working-directory: app/android
        run: |
          python3 - <<'PY'
          import os, re
          KVER = "2.0.21"

          for f in ("settings.gradle", "settings.gradle.kts"):
              if os.path.exists(f):
                  s = open(f).read()
                  s = re.sub(
                      r'(org\.jetbrains\.kotlin\.android["\']?\s*\)?\s*version\s*["\'])([0-9.]+)(["\'])',
                      lambda m: m.group(1) + KVER + m.group(3), s)
                  open(f, "w").write(s)
                  print("patched kotlin plugin:", f)

          for f in ("build.gradle", "build.gradle.kts"):
              if os.path.exists(f):
                  s = open(f).read()
                  if "kotlin-stdlib" not in s:
                      if f.endswith(".kts"):
                          s += ('\nsubprojects {\n  configurations.all {\n'
                                '    resolutionStrategy {\n'
                                '      force("org.jetbrains.kotlin:kotlin-stdlib:' + KVER + '")\n'
                                '    }\n  }\n}\n')
                      else:
                          s += ("\nsubprojects {\n  configurations.all {\n"
                                "    resolutionStrategy {\n"
                                "      force 'org.jetbrains.kotlin:kotlin-stdlib:" + KVER + "'\n"
                                "    }\n  }\n}\n")
                      open(f, "w").write(s)
                      print("patched stdlib force:", f)

          for f in ("app/build.gradle", "app/build.gradle.kts"):
              if os.path.exists(f):
                  s = open(f).read()
                  s = re.sub(r'minSdk\s*=\s*(flutter\.minSdkVersion|\d+)', 'minSdk = 24', s)
                  s = re.sub(r'minSdkVersion\s+(flutter\.minSdkVersion|\d+)', 'minSdkVersion 24', s)
                  open(f, "w").write(s)
                  print("patched minSdk:", f)

          # flutter_local_notifications 需要 core library desugaring（java.time 等）
          for f in ("app/build.gradle", "app/build.gradle.kts"):
              if not os.path.exists(f):
                  continue
              s = open(f).read()
              if "coreLibraryDesugaring" in s:
                  print("already desugared:", f)
                  continue
              kts = f.endswith(".kts")
              flag = "isCoreLibraryDesugaringEnabled = true" if kts else "coreLibraryDesugaringEnabled true"
              if "compileOptions {" in s:
                  s = s.replace("compileOptions {", "compileOptions {\n        " + flag, 1)
              else:
                  s = s.replace("android {", "android {\n    compileOptions {\n        " + flag + "\n    }", 1)
              # desugar_jdk_libs 2.x 需要 Java 11
              s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_11")
              dep = ('\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n'
                     if kts else
                     "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'\n}\n")
              s += dep
              open(f, "w").write(s)
              print("desugaring patched:", f)

          mf = "app/src/main/AndroidManifest.xml"
          if os.path.exists(mf):
              s = open(mf).read()
              want = [
                  'android.permission.MANAGE_EXTERNAL_STORAGE',
                  'android.permission.READ_EXTERNAL_STORAGE',
                  'android.permission.POST_NOTIFICATIONS',
                  'android.permission.RECEIVE_BOOT_COMPLETED',
              ]
              add = ''
              for p in want:
                  if p not in s:
                      add += '    <uses-permission android:name="%s"/>\n' % p
              if 'android.permission.WRITE_EXTERNAL_STORAGE' not in s:
                  add += ('    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" '
                          'android:maxSdkVersion="28"/>\n')
              if add:
                  s = s.replace("<application", add + "    <application", 1)
                  open(mf, "w").write(s)
                  print("manifest patched")
          PY

      # 固定签名：从 Secrets 解码 keystore，写 key.properties，patch build.gradle
      # 这样每次 CI 出的包签名一致，能直接覆盖安装
      - name: Setup release signing
        working-directory: app
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1) 解码 keystore 到 app/flashcard.p12
          echo "$KEYSTORE_B64" | base64 -d > android/app/flashcard.p12
          test -s android/app/flashcard.p12 || { echo "::error::KEYSTORE_B64 解码为空"; exit 1; }
          echo "keystore bytes: $(wc -c < android/app/flashcard.p12)"

          # 2) key.properties（Gradle root = android/）
          cat > android/key.properties <<EOF
          storePassword=$KS_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=flashcard.p12
          storeType=PKCS12
          EOF

          # 3) patch app/build.gradle(.kts) 用 release 签名
          python3 - <<'PY'
          import os

          load_groovy = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''

          signing_groovy = '''    signingConfigs {
              release {
                  keyAlias keystoreProperties['keyAlias']
                  keyPassword keystoreProperties['keyPassword']
                  storeFile file(keystoreProperties['storeFile'])
                  storePassword keystoreProperties['storePassword']
                  storeType 'PKCS12'
              }
          }

          '''

          load_kts = '''
          import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          '''

          signing_kts = '''    signingConfigs {
              create("release") {
                  keyAlias = keystoreProperties["keyAlias"] as String
                  keyPassword = keystoreProperties["keyPassword"] as String
                  storeFile = file(keystoreProperties["storeFile"] as String)
                  storePassword = keystoreProperties["storePassword"] as String
                  storeType = "PKCS12"
              }
          }

          '''

          done = False
          for f in ("android/app/build.gradle", "android/app/build.gradle.kts"):
              if not os.path.exists(f):
                  continue
              s = open(f).read()
              if "signingConfigs" in s and "release" in s.split("signingConfigs",1)[1][:400]:
                  print("already signed:", f)
                  done = True
                  break
              if f.endswith(".kts"):
                  s = s.replace("android {", load_kts + "\nandroid {\n" + signing_kts, 1)
                  s = s.replace('signingConfig = signingConfigs.getByName("debug")',
                                'signingConfig = signingConfigs.getByName("release")')
                  if 'getByName("debug")' in s:
                      raise SystemExit("kts: buildTypes 仍指向 debug 签名，补丁没生效")
              else:
                  s = s.replace("android {", load_groovy + "\nandroid {\n" + signing_groovy, 1)
                  # Flutter 3.24 模板是 `signingConfig = signingConfigs.debug`（**带等号**），
                  # 老补丁只匹配不带等号的写法，于是替换静默失败 —— APK 一直是 debug 签名，
                  # 而 CI 每次都是新机器，debug keystore 每次重新生成，指纹每次都变。
                  s = s.replace("signingConfig = signingConfigs.debug",
                                "signingConfig = signingConfigs.release")
                  s = s.replace("signingConfig signingConfigs.debug",
                                "signingConfig signingConfigs.release")
                  if "signingConfigs.debug" in s:
                      raise SystemExit("build.gradle 仍指向 debug 签名，补丁没生效")
              open(f, "w").write(s)
              print("signed:", f)
              done = True
              break
          if not done:
              raise SystemExit("build.gradle not found for signing patch")
          PY

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build release APK (arm64-v8a only)
        working-directory: app
        run: |
          flutter build apk --release \
            --target-platform=android-arm64 \
            --split-per-abi

      # 硬校验：必须是我们的 release keystore，不能是 CI 现场生成的 debug key
      - name: Verify signature
        working-directory: app
        run: |
          set -e
          ls -lh build/app/outputs/flutter-apk/
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | tail -1)
          OUT=$("$BT/apksigner" verify --print-certs "$APK")
          echo "$OUT"
          if echo "$OUT" | grep -q "CN=Android Debug"; then
            echo "::error::APK 仍是 debug 签名（每次 CI 指纹都变，无法覆盖安装）"
            exit 1
          fi
          echo "signature OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flashcard-arm64-v8a
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      # tag 推送时自动建 Release（版本号 = tag，如 v0.3.0）
      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: flashcard ${{ github.ref_name }}
          body: |
            flashcard ${{ github.ref_name }} · arm64-v8a release APK

            - 语篇（passage）：章首短文通读 + 语篇选词（多邻国式填词）
            - 连续打卡：连续天数 / 最长纪录 / 今日已打卡
            - 学习统计：累计已背 + 近 7 / 30 天柱状图
            - 背诵提醒：系统通知，每天固定时间提醒（默认 22:50，可自设）
            - 设置可开关：语义选项 / 短句选词 / 语篇选词；每日单词 / 卡牌背诵量
          files: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
