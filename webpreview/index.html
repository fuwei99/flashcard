<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>flashcard · 书架预览</title>
<style>
:root{
  --bg:#141d1f; --glass:rgba(255,255,255,.045); --line:rgba(255,255,255,.08);
  --txt:#f0f4f5; --muted:#8c9da2; --dim:#54666c;
  --teal:#00c08b; --teal-bg:rgba(0,192,139,.12);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;max-width:640px;margin:0 auto}

/* 顶栏 */
#topbar{flex:0 0 auto;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#topbar .row{display:flex;align-items:center;justify-content:space-between}
#topbar h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.3px}
#topbar .gear{width:34px;height:34px;border:0;border-radius:10px;background:var(--glass);
  color:var(--muted);font-size:17px;cursor:pointer}
#topbar .today{margin-top:9px}
#topbar .today .lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-bottom:5px}
#topbar .today .lbl b{color:var(--teal);font-variant-numeric:tabular-nums}
#topbar .bar{height:5px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
#topbar .bar > i{display:block;height:100%;width:0;background:var(--teal);transition:width .25s}

/* 视图容器 */
#view{flex:1 1 auto;overflow-y:auto;padding:14px 16px 28px;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}

/* 书卡片 */
.book{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:14px;
  background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:18px;cursor:pointer;transition:.15s}
.book:active{transform:scale(.985);background:rgba(255,255,255,.07)}
.book .spine{width:46px;height:62px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:22px;background:linear-gradient(135deg,#00c08b,#0a6b52);color:#141d1f}
.book .meta{flex:1;min-width:0}
.book .meta .t{font-size:17px;font-weight:600}
.book .meta .s{font-size:12px;color:var(--dim);margin-top:3px}
.book .meta .p{margin-top:8px;height:4px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.book .meta .p > i{display:block;height:100%;background:var(--teal);width:0}
.book .meta .c{font-size:11.5px;color:var(--muted);margin-top:5px}
.book .chev{color:var(--teal);font-size:18px}

/* 章节文件夹 */
.chapter{display:flex;align-items:center;gap:13px;padding:15px;margin-bottom:12px;
  background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:16px;cursor:pointer}
.chapter:active{background:rgba(255,255,255,.07)}
.chapter .ico{width:42px;height:42px;border-radius:11px;background:var(--teal-bg);display:flex;
  align-items:center;justify-content:center;font-size:20px}
.chapter .m{flex:1;min-width:0}
.chapter .m .t{font-size:15.5px;font-weight:600}
.chapter .m .s{font-size:12px;color:var(--dim);margin-top:4px}
.chapter .m .p{margin-top:7px;height:4px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.chapter .m .p > i{display:block;height:100%;background:var(--teal);width:0}

/* 开始栏 */
.startbar{display:flex;gap:10px;margin-bottom:14px}
.startbar button{flex:1;height:46px;border-radius:12px;border:1px solid rgba(0,192,139,.2);
  background:var(--teal-bg);color:var(--teal);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans)}
.startbar button:active{transform:scale(.98)}

/* 页面列表 */
.page{display:flex;align-items:center;gap:12px;padding:13px 14px;margin-bottom:8px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px}
.page .n{width:24px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.page .m{flex:1;min-width:0}
.page .m .w{font-size:15.5px;font-weight:600}
.page .m .ph{font-size:12px;color:var(--dim);margin-top:2px}
.page .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);flex:0 0 auto}
.page .dot.on{background:var(--teal);border-color:var(--teal)}

/* 返回条 */
.backbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--muted);font-size:13px;cursor:pointer}
.backbar .a{font-size:16px}

/* 背诵视图 */
#reviewView{display:none;flex-direction:column;height:100%;position:absolute;inset:0;background:var(--bg);z-index:5}
#reviewView.on{display:flex}
#reviewView .rtop{flex:0 0 auto;padding:12px 16px 8px}
#reviewView .rtop .r1{display:flex;align-items:center;gap:10px}
#reviewView .rtop .back{font-size:18px;color:var(--muted);cursor:pointer}
#reviewView .rtop .ttl{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#reviewView .rtop .cnt{font-size:13px;font-weight:600;color:var(--teal)}
#reviewView .rtop .bar{margin-top:8px;height:4px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
#reviewView .rtop .bar > i{display:block;height:100%;background:var(--teal);width:0;transition:width .2s}
#reviewView .rtop .td{margin-top:5px;font-size:11px;color:var(--dim)}
#cardHost{flex:1 1 auto;overflow:hidden;position:relative}

/* 设置弹层 */
#settingsMask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20;
  align-items:flex-end;justify-content:center}
#settingsMask.on{display:flex}
#settingsSheet{width:100%;max-width:640px;background:#182325;border-top-left-radius:20px;
  border-top-right-radius:20px;padding:22px 18px calc(24px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line)}
#settingsSheet h3{margin:0 0 4px;font-size:16px}
#settingsSheet .num{font-size:30px;font-weight:700;color:var(--teal);text-align:right}
#settingsSheet .sub{font-size:12.5px;color:var(--dim);margin-bottom:14px}
#settingsSheet .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
#settingsSheet .chip{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;
  background:var(--glass);border:1px solid var(--line);color:var(--muted);cursor:pointer}
#settingsSheet .chip.sel{background:var(--teal-bg);border-color:var(--teal);color:var(--teal)}
#settingsSheet .close{margin-top:18px;width:100%;height:46px;border-radius:12px;border:0;
  background:var(--teal);color:#141d1f;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--sans)}
#limitRange{width:100%;margin-top:10px;accent-color:var(--teal)}
#loading{color:var(--dim);text-align:center;padding:40px 0;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="row">
      <h1 id="pageTitle">书架</h1>
      <button class="gear" id="gearBtn">⚙</button>
    </div>
    <div class="today">
      <div class="lbl"><span>今日进度</span><b id="todayTxt">0 / 20</b></div>
      <div class="bar"><i id="todayBar"></i></div>
    </div>
  </header>
  <main id="view"><div id="loading">正在加载书本…</div></main>

  <section id="reviewView">
    <div class="rtop">
      <div class="r1">
        <span class="back" id="revBack">←</span>
        <span class="ttl" id="revTitle"></span>
        <span class="cnt" id="revCnt">已背 0 / 0</span>
      </div>
      <div class="bar"><i id="revBar"></i></div>
      <div class="td" id="revToday">今日 0 / 20</div>
    </div>
    <div id="cardHost"></div>
  </section>
</div>

<div id="settingsMask">
  <div id="settingsSheet">
    <div class="row" style="display:flex;justify-content:space-between;align-items:flex-end">
      <div><h3>每日背诵量</h3><div class="sub">每天背多少个卡片</div></div>
      <div class="num" id="limitNum">20</div>
    </div>
    <input type="range" id="limitRange" min="5" max="200" step="5" value="20">
    <div class="chips" id="limitChips"></div>
    <button class="close" id="settingsClose">完成</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
