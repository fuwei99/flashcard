<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>卡片复刻 · 预览</title>
<style id="tplcss"></style>
</head>
<body>
<div id="host" style="color:#5a6b70;text-align:center;padding:60px 0;font-family:sans-serif">正在加载…</div>
<script>
(async function () {
  try {
    var [book, manifest, html, css, js] = await Promise.all([
      fetch("../decks/interpret_demo.json").then(r => r.json()),
      fetch("../templates/mixup_dark/manifest.json").then(r => r.json()),
      fetch("../templates/mixup_dark/template.html").then(r => r.text()),
      fetch("../templates/mixup_dark/style.css").then(r => r.text()),
      fetch("../templates/mixup_dark/script.js").then(r => r.text())
    ]);

    document.getElementById("tplcss").textContent = css;

    var card = book.cards[0];
    var fields = {};
    (book.fields_order || []).forEach(f => fields[f] = card[f] != null ? card[f] : "");
    Object.keys(card).forEach(k => fields[k] = card[k]);

    function truthy(v) {
      if (v == null) return false;
      if (typeof v === "string") return v.trim() !== "";
      if (Array.isArray(v)) return v.length > 0;
      if (typeof v === "object") return Object.keys(v).length > 0;
      return !!v;
    }
    var out = html, prev;
    do {
      prev = out;
      out = out.replace(/\{\{([#^])(\w+)\}\}([\s\S]*?)\{\{\/\2\}\}/g, function (_, s, n, b) {
        return s === "#" ? (truthy(fields[n]) ? b : "") : (truthy(fields[n]) ? "" : b);
      });
    } while (out !== prev);
    out = out.replace(/\{\{(\w+)\}\}/g, function (_, n) {
      var v = fields[n];
      return (v == null || typeof v === "object") ? "" : String(v);
    });
    out = out.replace(/\{\{__index\}\}/g, "1").replace(/\{\{__total\}\}/g, "1");

    document.getElementById("host").outerHTML = out;

    window.Flashcard = {
      getCard: function () { return { fields: fields, state: { state: "new" }, index: 0, total: 1 }; },
      answer: function (r) { console.log("answer:", r); alert("评分：" + r); },
      tts: function (t, l) {
        if (!("speechSynthesis" in window)) return;
        speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(t);
        u.lang = l || "en-US"; u.rate = 0.95;
        speechSynthesis.speak(u);
      },
      getState: function () {}, setState: function () {},
      undo: function () {}, next: function () {}, prev: function () {}, ready: function () {}
    };

    var s = document.createElement("script");
    s.textContent = js;
    document.body.appendChild(s);
  } catch (e) {
    document.getElementById("host").textContent = "加载失败：" + e.message +
      "（请用 python3 -m http.server 起静态服务）";
  }
})();
</script>
</body>
</html>
